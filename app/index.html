<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blob Tracker</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --line: #8886; --accent: #2a7de1; --err: #d33; }
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  #drop { display: block; border: 2px dashed var(--line); border-radius: 8px; padding: 28px 16px;
          text-align: center; cursor: pointer; }
  #drop.over { border-color: var(--accent); }
  #drop input { display: block; margin: 10px auto 0; }
  #info { margin: 14px 0; font-variant-numeric: tabular-nums; }
  button, .button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line);
                    background: var(--accent); color: #fff; cursor: pointer; text-decoration: none;
                    display: inline-block; }
  button:disabled { opacity: .45; cursor: default; }
  progress { width: 100%; height: 14px; margin-top: 14px; }
  #status { font-variant-numeric: tabular-nums; margin-top: 4px; min-height: 1.4em; }
  #error { color: var(--err); white-space: pre-wrap; margin-top: 12px; }
  #result video { display: block; width: 100%; max-height: 70vh; background: #000; margin: 16px 0 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-state="idle">
<h1>Blob Tracker</h1>

<label id="drop">
  Drop a video here, or choose a file
  <input id="file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv">
</label>

<div id="info" hidden></div>
<button id="process" disabled>Process</button>

<div id="progress-box" hidden>
  <progress id="progress" max="1" value="0"></progress>
  <div id="status"></div>
</div>

<div id="error" role="alert" hidden></div>

<div id="result" hidden>
  <video id="output" controls playsinline></video>
  <a id="download" class="button" download>Download</a>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
